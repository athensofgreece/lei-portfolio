# Weekly checks for outdated packages and GitHub Actions. Dependabot only opens pull requests;
# nothing changes on your site until you review and merge one.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
